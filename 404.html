:root{
  --tinta:#0C1B2A;--creme:#FFF6EC;--creme2:#F6E9D8;--coral:#FF5436;--coral-ink:#D63B1F;--ouro:#FFC83D;
  --ink:#0C1B2A;--muted:#5B6776;
  --fd:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--fb:"Outfit",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px;width:100%}
.hbar{display:flex;align-items:center;height:70px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo .mk{width:44px;height:44px;border-radius:12px;background:var(--tinta);display:grid;place-items:center;flex:none}
.logo .mk svg{width:34px;height:28px}
.logo b{font-family:var(--fd);font-size:20px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1}
.logo small{display:block;font-family:var(--fb);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--coral);font-weight:600;margin-top:5px}
main{flex:1;display:flex;align-items:center;padding-block:clamp(48px,10vw,100px);position:relative;overflow:hidden}
main::before{content:"";position:absolute;right:-180px;top:-160px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,61,.28),rgba(255,200,61,0) 65%);pointer-events:none}
.box{position:relative;max-width:640px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--coral-ink)}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--coral)}
h1{font-family:var(--fd);line-height:1.08;letter-spacing:-.02em;margin:16px 0 18px;font-size:clamp(38px,6vw,64px);font-weight:800}
h1 em{font-style:normal;color:var(--coral)}
.lead{font-size:clamp(16.5px,1.6vw,19px);color:var(--muted);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15.5px;text-decoration:none;border:2px solid transparent;transition:transform .2s,background .2s;font-family:var(--fb);margin-top:30px;background:var(--coral);color:#fff;box-shadow:0 10px 24px -10px rgba(255,84,54,.7)}
.btn:hover{transform:translateY(-2px);background:#ff6a4f}
.btn svg{width:18px;height:18px;flex:none}
@media (max-width:680px){.btn{display:flex}}
